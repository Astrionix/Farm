workflows:
  ios-release:
    name: iOS App - FlockMind AI ERP
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store   # Change to "ad_hoc" for direct device install
        bundle_identifier: com.mahalakshmi.poultryerp
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.mahalakshmi.poultryerp"
      node: v18
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install Node dependencies
        script: |
          npm ci

      - name: Build Next.js web app
        script: |
          npm run build

      - name: Install Capacitor CLI
        script: |
          npm install -g @capacitor/cli

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - your-email@example.com   # Replace with your email
        notify:
          success: true
          failure: true
